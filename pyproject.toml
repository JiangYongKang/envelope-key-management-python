[project]
name = "envelope-key-management-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[pytest]
addopts = "-q"
testpaths = ["tests"]
log_cli = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
